FilterName="BlurName"
Description="Automatically mosaics the opponent's nickname in Super Smash Bros. Ultimate online matches."
Status="Status"
Status.Preparing="Preparing."
Status.RunningGpu="Running (overhead tag detection: GPU)."
Status.RunningCpu="Overhead tag detection is running on the CPU (the GPU could not be used). It may not keep up at 60fps. Updating the GPU driver and restarting OBS may let it use the GPU."
Status.Lagging="Overhead tag detection is not keeping up with the video ({count} times in the last minute). Meanwhile, a wider area around the overhead tags is masked. Reduce the load on your PC, for example by closing other apps."
Status.Unavailable="Overhead tags cannot be detected ({reason}). Only the names on the VS screen, HUD and results are masked. Reinstalling the plugin folder may fix this (see 'Troubleshooting' in the manual)."
Status.UnsupportedFormat="This video format ({format}) is not supported, so names cannot be masked. In the Video Capture Device properties, set Video Format to NV12 or YUY2."
Reason.RuntimeMissing="inference library not found"
Reason.RuntimeVersion="inference library version mismatch"
Reason.ModelMissing="model not found"
Reason.ModelFormat="model format mismatch"
Reason.InferenceFailed="inference failed"
Delay="Delay"
Delay.Value="About {delay} ms ({fps} fps)"
Unit="px units in settings"
Unit.Text="Based on 1080p. With 720p the values differ from actual pixels."
MosaicGroup="Mosaic strength"
MosaicStrength="Strength"
MosaicWeak="Weak"
MosaicNormal="Normal"
MosaicStrong="Strong"
MosaicStrength.Tooltip="Chooses the size of one mosaic block. Stronger hides names better; weaker shows more of the surroundings (default Normal)."
TagGroup="In-match: above characters"
TagWidth="Mask width [px]"
TagWidth.Tooltip="Width of the area that hides the overhead name tag, in pixels scaled to a 1920x1080 video (other video sizes scale proportionally). The narrower it is, the more easily the edge of the name shows. At 0 the overhead tag is not masked (default {default} px)."
TagHeight="Mask height [px]"
TagHeight.Tooltip="Height of the area that hides the overhead name tag, in pixels scaled to a 1920x1080 video. The lower it is, the more easily the name shows when the tag bobs up and down. At 0 the overhead tag is not masked (default {default} px)."
TagHold="Keep masking for [ms]"
TagHold.Tooltip="How long to keep masking after the tag is no longer detected (1000 ms = 1 second). Shorter hides the fighter for less time, but faint or fading tags may show the name (default {default} ms)."
TagLookAhead="Start masking early by [ms]"
TagLookAhead.Tooltip="How long before the tag is detected to start masking (1000 ms = 1 second). Shorter hides the fighter for less time, but the name may show when the tag first appears. The delay does not change (default {default} ms, which is also the maximum)."
FixedVsGroup="Pre-match versus card screen"
FixedHudGroup="In-match HUD"
FixedResultGroup="Results screen"
FixedX="Left [px]"
FixedY="Top [px]"
FixedW="Width [px]"
FixedH="Height [px]"
ResetGroup="Reset to defaults"
FixedVs.Tooltip="Area that hides the opponent's name plate at the top right of the VS screen, in pixels scaled to a 1920x1080 video with 0 at the top left. Set the width or height to 0 to stop hiding it (default {default} px)."
FixedHud.Tooltip="Area that hides the opponent's name in the HUD at the bottom during battle, including where the name slides during the zoom after GAME SET. Pixels scaled to a 1920x1080 video with 0 at the top left. Set the width or height to 0 to stop hiding it (default {default} px)."
FixedResult.Tooltip="Area that hides the opponent's name to the right of \"2P\" on the results details card. GSP on the right is not hidden. While the card slides in or moves, the name is tracked and hidden separately. Pixels scaled to a 1920x1080 video with 0 at the top left. Set the width or height to 0 to stop hiding it (default {default} px)."
