FilterName="相手名マスク"
Description="スマブラSP のオンライン対戦で、相手のニックネームを自動でモザイクにします。"
Status="状態"
Status.Preparing="準備中です。"
Status.RunningGpu="動作中です（頭上タグの検出: GPU）。"
Status.RunningCpu="頭上タグの検出を CPU で行っています（GPU を使えませんでした）。60fps で処理が追いつかないことがあります。GPU のドライバーを更新して OBS を起動し直すと、GPU を使えることがあります。"
Status.Lagging="頭上タグの検出が映像に追いついていません（直近 1 分に {count} 回）。そのあいだは頭上タグのまわりを広めに隠しています。ほかのアプリを閉じるなど、PC の負荷を下げてください。"
Status.Unavailable="頭上タグを検出できません（{reason}）。VS 画面・HUD・リザルトの名前だけを隠しています。プラグインのフォルダを入れ直すと直ることがあります（詳しくは取扱説明書の「困ったとき」）。"
Status.UnsupportedFormat="この映像の形式（{format}）には対応していないため、名前を隠せません。映像キャプチャデバイスのプロパティで、映像フォーマットを NV12 か YUY2 にしてください。"
Reason.RuntimeMissing="推論ライブラリが見つからない"
Reason.RuntimeVersion="推論ライブラリの版が合わない"
Reason.ModelMissing="モデルが見つからない"
Reason.ModelFormat="モデルの形式が合わない"
Reason.InferenceFailed="推論に失敗"
Delay="遅延時間"
Delay.Value="約{delay}ミリ秒({fps}fps)"
Unit="パラメータのpx単位"
Unit.Text="1080p基準。720pの場合ズレがあります。"
MosaicGroup="モザイクの強さ"
MosaicStrength="強さ"
MosaicWeak="弱い"
MosaicNormal="普通"
MosaicStrong="強い"
MosaicStrength.Tooltip="モザイクの 1 マスの大きさを選びます。強いほど名前が読みにくくなり、弱いほど周りが見えます（既定は普通）。"
TagGroup="試合中キャラ頭上"
TagWidth="隠す範囲の横幅[px]"
TagWidth.Tooltip="頭上タグ（キャラの上に出る名前）を隠す範囲の横幅です。1920×1080 の映像に換算した画素数です（ほかの大きさの映像では、同じ割合で伸び縮みします）。狭くするほど、名前の端が出やすくなります。0 にすると頭上タグは隠しません（既定は {default} px）。"
TagHeight="隠す範囲の高さ[px]"
TagHeight.Tooltip="頭上タグを隠す範囲の高さです（1920×1080 の映像に換算した画素数）。低くするほど、タグが上下に揺れたときに名前が出やすくなります。0 にすると頭上タグは隠しません（既定は {default} px）。"
TagHold="隠し続ける時間[ms]"
TagHold.Tooltip="頭上タグを検出できなくなってから、隠し続ける時間です（1000 ms が 1 秒）。短くするとキャラが隠れる時間は減りますが、薄いタグや消え際で名前が見えやすくなります（既定は {default} ms）。"
TagLookAhead="隠し始める時間[ms]"
TagLookAhead.Tooltip="頭上タグを検出したコマより前から隠し始める時間です（1000 ms が 1 秒）。短くするとキャラが隠れる時間は減りますが、タグの出始めで名前が見えやすくなります。遅延時間は変わりません（既定は {default} ms で、これより長くはできません）。"
FixedVsGroup="試合前対戦カード画面"
FixedHudGroup="試合中HUD"
FixedResultGroup="リザルト画面"
FixedX="左端[px]"
FixedY="上端[px]"
FixedW="横幅[px]"
FixedH="高さ[px]"
ResetGroup="既定値に戻す"
FixedVs.Tooltip="VS 画面の右上にある相手の名札を隠す範囲です。1920×1080 の映像に換算した画素数で、左上が 0 です。横幅か高さを 0 にすると、ここは隠しません（既定は {default} px）。"
FixedHud.Tooltip="バトル中、画面下の HUD にある相手の名前を隠す範囲です。GAME SET の後のズームで名前が流れる先まで含めています。1920×1080 の映像に換算した画素数で、左上が 0 です。横幅か高さを 0 にすると、ここは隠しません（既定は {default} px）。"
FixedResult.Tooltip="リザルトの結果詳細で、相手のカードの「2P」の右に出る名前を隠す範囲です。右の世界戦闘力は隠しません。カードが入ってくる間・動く間の名前は、これとは別に追いかけて隠します。1920×1080 の映像に換算した画素数で、左上が 0 です。横幅か高さを 0 にすると、ここは隠しません（既定は {default} px）。"
